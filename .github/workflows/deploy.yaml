name: Build and Deploy to EKS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: maaaa123/flask-app
  AWS_REGION: us-east-1
  CLUSTER_NAME: demo-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -f Dockerfile.distroless -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Print OIDC claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== DECODED OIDC CLAIMS ==="
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777035566043:role/github-actions-eks-deploy
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/flask-app flask-app=$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/flask-app
